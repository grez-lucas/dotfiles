# Everforest, dark, medium background.
# Palette: https://github.com/sainnhe/everforest
#
# Contrast against the #2D353B background (WCAG, 4.5:1 floor for body text):
# foreground 7.38, every accent 4.55 or higher. The upstream dim grey
# (#859289, 3.84) fails the floor, so bright black uses grey2 #9DA9A0 (5.12),
# which is what dim text such as autosuggestions renders in.

foreground            #D3C6AA
background            #2D353B
selection_foreground  #D3C6AA
selection_background  #475258
url_color             #7FBBB3
cursor                #D3C6AA
cursor_text_color     #2D353B

# black
color0   #475258
color8   #9DA9A0

# red
color1   #E67E80
color9   #E67E80

# green
color2   #A7C080
color10  #A7C080

# yellow
color3   #DBBC7F
color11  #DBBC7F

# blue
color4   #7FBBB3
color12  #7FBBB3

# magenta
color5   #D699B6
color13  #D699B6

# cyan
color6   #83C092
color14  #83C092

# white
color7   #D3C6AA
color15  #D3C6AA

# tab bar (powerline style, bottom edge). Inactive tabs sit on the page
# background: grey2 on bg1 would be 4.44:1, under the floor.
tab_bar_background       #2D353B
active_tab_foreground    #2D353B
active_tab_background    #A7C080
inactive_tab_foreground  #9DA9A0
inactive_tab_background  #2D353B

# window borders
active_border_color      #A7C080
inactive_border_color    #475258
