

# Opaque: at 0.9 the desktop bled through and dropped the effective
# contrast of already-dim syntax groups (comments worst).
background_opacity 1.0
include colors/everforest.conf

#----------------------------

# fonts
font_size 11.5
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
disable_ligatures never

# Thicken stems for light-on-dark rendering; JetBrains Mono renders thin
# and smeary at this DPI without it.
text_composition_strategy 1.4 25
# Extra leading makes comment lines scannable.
modify_font cell_height 108%

# padding and window
window_margin_width 0
window_padding_width 12
remember_window_size yes
hide_window_decorations no
wayland_titlebar_color system
draw_minimal_borders yes
window_border_width 0


# Tab bar styling
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0

# Mouse and URL styling
mouse_hide_wait 3.0
url_style double
clipboard_control write-clipboard write-primary no-append read-clipboard read-primary

# Cursor customization
cursor_shape beam
cursor_blink_interval 0.5

# Terminal bell: kitty rings this on rejected input (arrow at end of a list,
# typing where typing isn't accepted). By default it plays event "bell" via
# libcanberra, which falls through the __custom theme to freedesktop's
# bell.oga - the water-drop sound. Visual feedback is enough here.
enable_audio_bell no
